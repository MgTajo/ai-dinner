# Builds the web app and publishes it to GitHub Pages (https://<owner>.github.io/<repo>/) on
# every push to main. The site runs standalone: on-device language parser and simulated
# settlement. To connect it to a deployed companion server (model + devnet payments), set the
# repository variable COMPANION_URL to that server's https:// address and add this site's origin
# to the companion's CORS_ALLOW_ORIGIN.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web build
        run: npx expo export --platform web
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_COMPANION_URL: ${{ vars.COMPANION_URL }}
      # Pages has no SPA routing: serve the app for deep links too, and skip Jekyll.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
